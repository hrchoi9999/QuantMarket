[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  ".git",
  ".venv",
  "venv",
  "venv64",
  "archive",
  "_tmp",
  "__pycache__",
  "data",
  "reports",
  "models",
  "service_platform/web/public_data/current",
  "service_platform/web/public_data/admin_market/current",
  "service_platform/web/public_data/handoff",
  "service_platform/ai_training",
  "service_platform/global_context",
  "service_platform/research",
  "service_platform/quant_model_handoff",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
